# HLab configuration of lab 2 of clowder's live tests (bin/dev live runs
# up to three at once): a lab of its own, so it does not disturb other labs.
# Every key not set here takes HLab's default. The ports on the host's
# localhost differ from HLab's defaults (8480, 1080) and from the other labs.
name: clowder-live-2
ui_port: 8483
socks_port: 1083
# Only the image the hosts start from: a lab loads each of its OS images at
# its first start, and Ubuntu's would cost minutes for nothing.
images:
  debian-13:
    url: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-generic-amd64.qcow2
    checksums: https://cloud.debian.org/images/cloud/trixie/latest/SHA512SUMS
