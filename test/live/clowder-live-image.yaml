# HLab configuration of the lab that makes the live tests' host image
# (bin/dev live image): a lab of its own, stopped once the image is made.
# The ports on the host's localhost differ from HLab's defaults (8480, 1080)
# and from the live tests' lab.
name: clowder-live-image
ui_port: 8485
socks_port: 1085
# Only the image the hosts start from: a lab loads each of its OS images at
# its first start, and Ubuntu's would cost minutes for nothing.
images:
  debian-13:
    url: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-generic-amd64.qcow2
    checksums: https://cloud.debian.org/images/cloud/trixie/latest/SHA512SUMS
