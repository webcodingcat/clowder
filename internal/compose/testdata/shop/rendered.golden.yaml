name: default_shop
services:
  app:
    deploy:
      resources:
        reservations:
          cpus: 0.5
          memory: "268435456"
    restart: "no"
    dns:
      - 169.254.77.53
    environment:
      DB_HOST: db
      GREETING: Hello $$USER
    image: ghcr.io/example/shop:1.4
    labels:
      clowder.stack: default_shop
    networks:
      default: null
    depends_on:
      db:
        condition: service_started
        required: true
  cache:
    restart: "no"
    dns:
      - 169.254.77.53
    image: valkey/valkey:8
    labels:
      clowder.stack: default_shop
    networks:
      default: null
    volumes:
      - type: volume
        source: cachedata
        target: /data
        volume: {}
    ports:
      - mode: ingress
        host_ip: 203.0.113.11
        target: 6379
        published: "6379"
        protocol: tcp
      - mode: ingress
        host_ip: 10.77.0.3
        target: 6379
        published: "6379"
        protocol: tcp
      - mode: ingress
        host_ip: 203.0.113.11
        target: 9987
        published: "9987"
        protocol: udp
      - mode: ingress
        host_ip: 10.77.0.3
        target: 9987
        published: "9987"
        protocol: udp
  db:
    restart: "no"
    dns:
      - 169.254.77.53
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db-password
    image: postgres:17
    labels:
      clowder.secrets: digest-of-db-password
      clowder.stack: default_shop
    networks:
      default: null
    secrets:
      - source: db-password
    volumes:
      - type: volume
        source: pgdata
        target: /var/lib/postgresql/data
        volume: {}
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
        bind: {}
    healthcheck:
      test:
        - CMD
        - pg_isready
      interval: 10s
networks:
  default:
    name: default_shop_default
    driver_opts:
      com.docker.network.bridge.name: cbr-5be479caf0c
volumes:
  cachedata:
    name: clw-default-shop-cachedata-dff59c13-g2
    driver: local
    driver_opts:
      device: /var/lib/clowder/volumes/clw-default-shop-cachedata-dff59c13-g2/data
      o: bind
      type: none
  pgdata:
    name: clw-default-shop-pgdata-e2128834-g1
    driver: local
    driver_opts:
      device: /var/lib/clowder/volumes/clw-default-shop-pgdata-e2128834-g1/data
      o: bind
      type: none
secrets:
  db-password:
    file: /run/clowder-secrets/default_shop/files/db-password
