# The example stack: an app behind Traefik, a database that is
# replicated and backed up, a cache that is thrown away.
x-clowder:
  priority: high
  exports: [db]

services:
  app:
    image: ghcr.io/example/shop:1.4
    depends_on: [db]
    restart: unless-stopped
    environment:
      DB_HOST: db
    x-clowder:
      http: {host: shop.example.com, port: 8080}
    deploy:
      resources:
        reservations: {memory: 256M, cpus: "0.5"}
  db:
    image: postgres:17
    volumes:
      - pgdata:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
    x-clowder:
      priority: critical
  cache:
    image: valkey/valkey:8
    restart: on-failure:3
    volumes: [cachedata:/data]
    ports: ["6379:6379/tcp", "9987:9987/udp"]
    x-clowder:
      priority: low
      restart_unhealthy: false

volumes:
  pgdata:
    x-clowder:
      class: fast
      size: 20G
      replicas: 2
      backup:
        schedule: daily
        keep: 14
        pre: {service: db, command: [pg_dumpall, -f, /var/lib/postgresql/data/dump.sql]}
  cachedata:
    x-clowder: {class: any, size: 2G, replicas: 0}
