name: shop_web
services:
  app:
    container_name: shop_web_app
    image: registry.example.com/shop:1.4
    command:
      - serve
      - --port
      - "8080"
    entrypoint:
      - /bin/entry
    working_dir: /app
    user: "1000"
    secrets:
      - api-key
    volumes:
      - type: volume
        source: uploads
        target: /app/uploads
        read_only: true
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 67108864
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
    ports:
      - target: 8443
        published: "9443"
        host_ip: 203.0.113.11
        protocol: tcp
      - target: 8443
        published: "9443"
        host_ip: 10.77.0.3
        protocol: tcp
      - target: 9987
        published: "9987"
        host_ip: 203.0.113.11
        protocol: udp
      - target: 9987
        published: "9987"
        host_ip: 10.77.0.3
        protocol: udp
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    dns:
      - 169.254.77.53
    labels:
      clowder.secrets: digest-of-api-key
      clowder.stack: shop_web
    read_only: true
    init: true
    shm_size: 134217728
    cap_add:
      - NET_BIND_SERVICE
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    networks:
      - net
  db:
    container_name: shop_web_db
    image: postgres:17
    environment:
      GREETING: Hello $$USER
      POSTGRES_USER: shop
    volumes:
      - type: volume
        source: data
        target: /var/lib/postgresql/data
    healthcheck:
      test:
        - CMD
        - pg_isready
        - -U
        - shop
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: "no"
    dns:
      - 169.254.77.53
    labels:
      clowder.stack: shop_web
    deploy:
      resources:
        reservations:
          memory: "536870912"
          cpus: "0.5"
        limits:
          memory: "1073741824"
          cpus: "2"
    stop_grace_period: 30s
    stop_signal: SIGINT
    networks:
      - net
  worker:
    container_name: shop_web_worker
    image: registry.example.com/shop:1.4
    command:
      - work
    depends_on:
      app:
        condition: service_started
    restart: "no"
    dns:
      - 169.254.77.53
    labels:
      clowder.stack: shop_web
    networks:
      - net
networks:
  net:
    name: shop_web_net
    driver_opts:
      com.docker.network.bridge.name: cbr-97375646b1d
volumes:
  data:
    name: clw-shop-web-data-d8035330-g1
    driver: local
    driver_opts:
      device: /var/lib/clowder/volumes/clw-shop-web-data-d8035330-g1/data
      o: bind
      type: none
  uploads:
    name: clw-shop-web-uploads-a79fce31-g1
    driver: local
    driver_opts:
      device: /var/lib/clowder/volumes/clw-shop-web-uploads-a79fce31-g1/data
      o: bind
      type: none
secrets:
  api-key:
    file: /run/clowder-secrets/shop_web/files/api-key
