# every way a value may stand: Rewrite replaces only the armor
name: prod
hoster:
  type: hetzner
  token: !secret |
    -----BEGIN AGE ENCRYPTED FILE-----
    new 0 hoster.token
    second line
    -----END AGE ENCRYPTED FILE-----
  # a comment right after the block stays
join_keys:
  - !secret |-
      -----BEGIN AGE ENCRYPTED FILE-----
      new 0 join_keys[0]
      second line
      -----END AGE ENCRYPTED FILE-----
  - !secret |+  # kept with its blank line
    -----BEGIN AGE ENCRYPTED FILE-----
    new 0 join_keys[1]
    second line
    -----END AGE ENCRYPTED FILE-----

registries:
  "münchen.example:5000":
    username: ci
    password: !secret |
      -----BEGIN AGE ENCRYPTED FILE-----
      new 0 registries["münchen.example:5000"].password
      second line
      -----END AGE ENCRYPTED FILE-----
---
apiVersion: clowder/v1
kind: Secret
metadata: {namespace: shop, name: db-password}
spec:
  value: !secret |
    -----BEGIN AGE ENCRYPTED FILE-----
    new 1 spec.value
    second line
    -----END AGE ENCRYPTED FILE-----
