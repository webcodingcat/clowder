# Lint, unit tests, cross build and Debian packages on every push and pull
# request, through the same bin/dev as on a workstation. The live tests need
# HLab with /dev/kvm and stay manual.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lint
        run: bin/dev lint
      - name: Unit tests
        run: bin/dev test
      - name: Build and package
        run: bin/dev package
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
